name: desktop-tauri-build

# Builds the Kimi Code Desktop (Tauri) installers for macOS, Windows and Linux.
#
# Current architecture (post-SEA): the embedded agent is a PLATFORM-INDEPENDENT
# JS bundle — apps/kimi-code is packed by tsdown into
# dist-native/intermediates/main.cjs, staged into the app bundle by
# scripts/before-bundle.cjs (Tauri beforeBundleCommand), and executed at
# runtime by Node. Only the Rust shell and the installers are per-platform,
# so each OS builds on its own runner.
#
# Note: the packaged app currently resolves the Node runtime from
# <resource_dir>/node[.exe] and falls back to the system Node on PATH
# (>= 24.15 required) — bundling a per-platform Node runtime is a known gap,
# not handled by this workflow yet.
#
# Triggers:
#   - workflow_dispatch: manual ad-hoc builds from the Actions tab.
#   - push tag `desktop-v*`: build installers and attach them to a GitHub
#     Release named after the tag.
#   - workflow_call: reusable from other workflows.

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 5
  push:
    tags:
      - 'desktop-v*'
  workflow_call:
    inputs:
      retention-days:
        required: false
        type: number
        default: 5

permissions:
  contents: write # attach installers to a GitHub Release on tag builds

concurrency:
  group: desktop-tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/kimi-desktop-tauri/src-tauri

      # Linux: WebKitGTK + AppImage tooling (required by Tauri).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the shared packages (main.cjs references their dist/ output).
      - name: Build packages
        run: pnpm run build:packages

      # Build the embedded agent: tsdown main.cjs (no browser UI in this
      # fork — the daemon serves REST/WS only). Mirrors scripts/build-run.sh.
      - name: Build vis asset (tsdown prerequisite)
        run: node apps/kimi-code/scripts/build-vis-asset.mjs

      - name: Build embedded agent (tsdown → main.cjs)
        run: pnpm -C apps/kimi-code exec tsdown --config tsdown.native.config.ts

      # Package installers. beforeBuildCommand builds the Svelte frontend
      # (vite), beforeBundleCommand stages main.cjs into the bundle.
      - name: Build Tauri app
        working-directory: apps/kimi-desktop-tauri
        run: pnpm run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimi-desktop-tauri-${{ matrix.target }}
          path: |
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.dmg
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.app
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.msi
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.exe
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.deb
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.rpm
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.AppImage
          retention-days: ${{ inputs.retention-days || 5 }}

      - name: Attach installers to the Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.dmg
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.msi
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.exe
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.deb
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.rpm
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.AppImage
