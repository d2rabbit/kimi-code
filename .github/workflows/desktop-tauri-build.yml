name: desktop-tauri-build

# Builds the Kimi Code Desktop (Tauri) installers for macOS, Windows and Linux.
# Each runner builds the matching-platform SEA backend first, then stages it
# and packages with Tauri's bundler.
#
# SEA injection is per-platform (the blob is injected into the host Node binary),
# so each OS must be built on its own runner.
#
# Triggered two ways:
#   - workflow_dispatch: manual ad-hoc builds from the Actions tab.
#   - workflow_call:     called by release.yml to attach installers to a release.
on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 5
  workflow_call:
    inputs:
      retention-days:
        required: false
        type: number
        default: 5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
          - os: macos-13
            target: darwin-x64
            rust-target: x86_64-apple-darwin
          - os: windows-latest
            target: win32-x64
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: linux-x64
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/kimi-desktop-tauri/src-tauri

      # Linux: install WebKitGTK dependencies (required by Tauri)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the web UI and copy it into the kimi-code package so the SEA
      # bundles the latest frontend.
      - name: Build web UI
        run: |
          pnpm --filter @moonshot-ai/kimi-web run build
          node apps/kimi-code/scripts/copy-web-assets.mjs

      # Build the SEA backend for this platform.
      - name: Build SEA backend
        run: pnpm --filter @moonshot-ai/kimi-code run build:native:sea

      # Build + package the Tauri app (triggers before-bundle.cjs to stage the SEA).
      - name: Build Tauri app
        working-directory: apps/kimi-desktop-tauri
        run: pnpm run tauri:build
        env:
          TAURI_PLATFORM: ${{ matrix.target }}
          TAURI_ARCH: ${{ contains(matrix.target, 'arm64') && 'arm64' || 'x64' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimi-desktop-tauri-${{ matrix.target }}
          path: |
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.dmg
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.app
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.msi
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.exe
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.deb
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.AppImage
          retention-days: ${{ inputs.retention-days }}
