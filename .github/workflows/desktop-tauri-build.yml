name: desktop-tauri-build

# Builds the Kimi Code Desktop (Tauri) installers for macOS (arm64), Windows
# and Linux, then archives every installer to a GitHub Release.
#
# Current architecture (post-SEA): the embedded agent is a PLATFORM-INDEPENDENT
# JS bundle — apps/kimi-code is packed by tsdown into
# dist-native/intermediates/main.cjs, staged into the app bundle by
# scripts/before-bundle.cjs (Tauri beforeBundleCommand), and executed at
# runtime by Node. Only the Rust shell and the installers are per-platform,
# so each OS builds on its own runner.
#
# The packaging hook copies the runner's Node >=24.15 runtime alongside
# main.cjs, so installers are self-contained and never depend on system Node.
#
# Triggers:
#   - workflow_dispatch: manual ad-hoc builds from the Actions tab.
#   - push to `release`: every landing on the release branch builds the
#     full platform matrix, uploads installer artifacts, AND archives them
#     to a dated GitHub Release (desktop-v0.1.0-YYYY.MM.DD).
#   - push tag `desktop-v*`: build installers and archive them under the
#     pushed tag's own GitHub Release.
#   - workflow_call: reusable from other workflows.

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 5
  push:
    branches:
      - release
    tags:
      - 'desktop-v*'
  workflow_call:
    inputs:
      retention-days:
        required: false
        type: number
        default: 5

permissions:
  contents: write # create GitHub Releases + attach installers

concurrency:
  group: desktop-tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/kimi-desktop-tauri/src-tauri

      # Linux: WebKitGTK + AppImage tooling (required by Tauri).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the shared packages (main.cjs references their dist/ output).
      - name: Build packages
        run: pnpm run build:packages

      # Build the embedded agent: tsdown main.cjs (no browser UI in this
      # fork — the daemon serves REST/WS only). Mirrors scripts/build-run.sh.
      - name: Build vis asset (tsdown prerequisite)
        run: node apps/kimi-code/scripts/build-vis-asset.mjs

      - name: Build embedded agent (tsdown → main.cjs)
        run: pnpm -C apps/kimi-code exec tsdown --config tsdown.native.config.ts

      - name: Typecheck desktop frontend
        working-directory: apps/kimi-desktop-tauri
        run: pnpm run typecheck

      # tauri-build (build.rs) validates every path in tauri.conf.json's
      # bundle.resources at compile time. resources/bin and resources/codegraph
      # are gitignored (staged by before-bundle.cjs only during packaging), so a
      # bare `cargo test` aborts with "resource path doesn't exist" before any
      # test runs. Create empty directories so build.rs passes; real staging
      # still happens in the "Build Tauri app" step via beforeBundleCommand.
      - name: Ensure Tauri resource directories exist
        run: >
          node -e
          "for (const p of ['apps/kimi-desktop-tauri/src-tauri/resources/bin','apps/kimi-desktop-tauri/src-tauri/resources/codegraph/bin','apps/kimi-desktop-tauri/src-tauri/resources/codegraph/lib']) require('node:fs').mkdirSync(p,{recursive:true})"

      - name: Test desktop Rust shell
        run: cargo test --manifest-path apps/kimi-desktop-tauri/src-tauri/Cargo.toml

      # Package installers. beforeBuildCommand builds the Svelte frontend
      # (vite), beforeBundleCommand stages main.cjs + Node into the bundle.
      - name: Build Tauri app
        working-directory: apps/kimi-desktop-tauri
        run: pnpm run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimi-desktop-tauri-${{ matrix.target }}
          path: |
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.dmg
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.msi
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.exe
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.deb
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.rpm
            apps/kimi-desktop-tauri/src-tauri/target/release/bundle/**/*.AppImage
          retention-days: ${{ inputs.retention-days || 5 }}

  # Archive every installer to a GitHub Release. Runs only after all platform
  # builds succeed, so there is no upload race. On `release`-branch pushes a
  # dated tag (desktop-v0.1.0-YYYY.MM.DD) is generated; on `desktop-v*` tag
  # pushes the pushed tag is reused. Manual dispatch skips archiving.
  release:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # release-branch push: synthesize a dated tag.
            echo "name=desktop-v0.1.0-$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: kimi-desktop-tauri-*
          merge-multiple: false

      # Flatten the nested artifact layout into a single dir of installers.
      # download-artifact preserves per-target subdirs (darwin-arm64/, ...);
      # we only want the actual installer files for the Release assets.
      - name: Stage installers
        run: |
          mkdir -p release-assets
          find installers -type f \( \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' \
          \) -exec cp {} release-assets/ \;
          echo "=== staged installers ==="
          ls -la release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating Release $TAG."
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --notes "Automated desktop build from ${GITHUB_REF#refs/heads/} @ ${GITHUB_SHA::7}.

          ## 平台 / Platforms

          | 平台 | 安装包 |
          |------|--------|
          | macOS (Apple Silicon) | \`.dmg\` |
          | Windows (x64) | \`.msi\` (en-US, zh-CN), \`.exe\` (NSIS) |
          | Linux (x64) | \`.deb\`, \`.rpm\`, \`.AppImage\` |

          > 产物由 \`desktop-tauri-build\` 自动打包归档。"
          fi
