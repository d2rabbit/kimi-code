<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kimi Code Desktop</title>
    <!-- No inline scripts: Tauri's production CSP enforces script-src 'self'.
         The color scheme is handled by CSS @media (prefers-color-scheme) as a
         default, then JS in main.ts applies the persisted preference on mount. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
